# file-librarian configuration.
# `flib init` writes a short one for you. Or copy this file to
# ~/.config/file-librarian/config.yaml (or point $FLIB_CONFIG at it)
# and check it with: flib check-config
# An invalid file stops the run before any file is touched.

# Language of generated names and descriptions, and of the default folder and
# category names below: en | pt-BR. Anything you set explicitly wins.
#   en    -> ~/Downloads/Organized, _Review, Finance, Contracts, Installers, Images, Other
#   pt-BR -> ~/Downloads/Organizado, _Revisar, and 15 categories: Financeiro, Impostos,
#            Contratos, Documentos pessoais, Saúde, Trabalho, Estudos, Viagens, Compras,
#            Casa e veículos, Imagens, Vídeos e áudio, Instaladores, Código e dados, Outros
language: en

# Folders to keep organized. Only their top level is read. Each is a plain path,
# or a mapping with `path` and rules for that folder alone (all optional):
#   only: [globs]        take only names matching one of these; leave the rest alone
#   ignore: [globs]      leave these alone too (added to `ignore` below; wins over only)
#                        Patterns match names ignoring case and accents' Unicode form.
#   min_age_days: 7      take an item only once it has not changed for this many days
#                        (counted from its last change or arrival in the folder, not
#                        from when it was last opened; for a folder, the newest item
#                        inside). Younger ones are skipped as "too recent (N days
#                        left)". Default 0.
#   category: Name       a fixed, configured category: no AI call, no cost; the name is
#                        kept, no description is stored, tags are words of the name
#   rename: true         with category: apply naming.pattern to the original name
#   layout: "{year}"     with category: its sub-folders, instead of the category's layout
#   folders: ignore      as_unit | ignore, instead of the global `folders`
#   duplicates: leave    move | leave, instead of the global `duplicates`
# Inputs must not overlap (one inside another), nor sit inside output_root.
inputs:
  - ~/Downloads
  # - path: ~/Desktop                 # work in progress lives here: be conservative
  #   only: ["*.pdf", "*.docx", "*.xlsx", "*.png", "*.jpg", "*.heic"]
  #   min_age_days: 7
  #   folders: ignore
  # - path: ~/Pictures/Screenshots    # a folder just for screenshots: macOS
  #                                   # Cmd+Shift+5 > Options > Other Location
  #   category: Screenshots           # must be in `categories` below
  #   layout: "{year}/{month}"
  #   only: ["Screenshot*.png", "Screen Recording*.mov"]   # a fixed category files
  #   folders: ignore                 # everything it takes unseen: always give `only`

# Where category folders are created. Default depends on language.
# output_root: ~/Downloads/Organized

# Low-confidence files land here for you to decide. Default depends on language.
# review_folder: _Review

# Files with the same content as one already filed (re-downloads, "x (1).pdf"):
#   move  -> into duplicates_folder, inside output_root, never deleted, never
#            sent to the AI (no cost); flib undo puts them back
#   leave -> they stay where they are
duplicates: move
# duplicates_folder: _Duplicates   # default depends on language (pt-BR: _Duplicados)

# SQLite index. Kept outside the organized folders so it is never moved.
# database: ~/Library/Application Support/file-librarian/library.db

provider:
  name: anthropic            # anthropic | claude-code (your Claude subscription, no key) | ollama (a local model) | openai-compat (any OpenAI-compatible API) | fake (offline, for trying flib)
  model: claude-haiku-5-5    # fast and cheap; for harder files try claude-sonnet-5-5 or claude-opus-5-5
  effort: low                # low | medium | high | xhigh | max: classification needs little (anthropic)
  max_chars_per_file: 4000   # only this much text is ever sent
  max_examples: 10           # recent corrections (flib fix, reconcile) sent as examples; 0-50, 0 = none
  requests_per_minute: 30    # not applied to a provider on this Mac (ollama, or base_url on localhost)
  max_retries: 3
  timeout_seconds: 60        # raise it for a slow local model
  # Where the API key comes from (never from this file):
  #   auto: the environment variable (ANTHROPIC_API_KEY, or for openai-compat the one
  #   below), then the macOS Keychain (`flib key set`), then env_file
  api_key_source: auto       # auto | environment | keychain | env_file
  # env_file: ~/.config/file-librarian/.env   # a file with ANTHROPIC_API_KEY=..., mode 600
  # claude-code only: the `claude` executable. Unset, it is looked up on PATH and in
  # ~/.local/bin, ~/.claude/local, /opt/homebrew/bin and /usr/local/bin; `flib schedule`
  # tells you when the daily run needs it set.
  # command: ~/.local/bin/claude
  #
  # openai-compat and ollama only:
  # base_url: https://api.openai.com/v1   # the part before /chat/completions; required for
  #                                       # openai-compat; ollama: http://localhost:11434/v1
  # api_key_env: FLIB_OPENAI_COMPAT_API_KEY   # openai-compat: the variable holding the key
  #                                       # (optional; `flib key set --provider openai-compat`
  #                                       # stores it in the Keychain instead). ollama takes none.
  # price_input_per_mtok: 0    # US$ per million input tokens. While both prices are 0 the
  # price_output_per_mtok: 0   # cost counts as 0 and limits.max_cost_usd_per_run cannot stop a run
  # vision: false              # true when the model reads images (with vision.enabled);
  #                            # scanned PDFs are never sent to these providers

limits:
  max_files_per_run: 200
  stable_seconds: 60         # size and mtime unchanged for this long
  max_attempts: 3            # after this many failures a file becomes "failed"
  confidence_threshold: 0.7  # below this, the file goes to review_folder
  max_cost_usd_per_run: 1.00 # estimated; files left over wait for the next run (null = no cap)
                             # (cannot stop a provider whose prices are 0 = unknown, see above)

naming:
  pattern: "{date}_{subject}"   # e.g. 2026-11-16_electricity-invoice.pdf
  date_order: DMY               # how to read ambiguous dates in documents: DMY | MDY | YMD
  max_length: 80                # 16-255 characters, extension included
  rename_confidence_threshold: 0.8

# Closed list: the AI can only pick one of these. Omit it to use the defaults
# of your language. Setting it replaces the defaults entirely.
# "hint" goes into the prompt and is the main lever to fix wrong classifications.
# categories:
#   - name: Finance
#     hint: invoices, bills, bank statements, receipts, tax documents
#     layout: "{year}"       # optional sub-folders: Finance/2026/...
#   - name: Contracts
#     hint: contracts, terms, signed proposals
#     layout: "{issuer}"     # Contracts/Acme/...; the same company, the same folder
#
# layout placeholders (each part between "/" is one folder, up to 3 levels):
#   {year}, {month}  the document's date, else the download date, else the day filed
#   {issuer}         the organisation it comes from, as the AI names it; alone in its part
# A value that is unknown stops there: the file goes to the deepest folder known.
# No layout (the default) keeps the category one flat folder. After adding one,
# `flib reprocess --apply-layout` moves what is already organized (no AI).
#   - name: Installers
#     hint: applications, disk images and installer packages
#     rename: false          # keep the original name
#   - name: Images
#   - name: Other

folders: as_unit             # sub-folders and .app bundles: as_unit (move whole) | ignore

finder_tags:                 # RF-36: after a move, tag the file in Finder with its category
  enabled: true              # your own tags are kept; flib undo removes only the tag flib added

ignore:
  - "*.crdownload"
  - "*.part"
  - ".DS_Store"
  - ".localized"
  - "._*"

never_send:                  # classified from metadata only, never sent to the provider
  - "*.pem"
  - "*.key"
  - ".env*"

ocr:                         # RF-26: read the text in images and scanned PDFs, on this Mac
  enabled: true              # macOS's own text recognition; nothing is sent anywhere for it
  # languages: [en-US]       # default from `language`: en -> [en-US], pt-BR -> [pt-BR, en-US]
  max_pages: 3               # only the first pages of a PDF with no text layer are read (1-20)
  min_chars: 40              # fewer letters and digits: a photo, not a document (vision or metadata)

vision:                      # RF-05, RF-26: let the model look at images and scanned PDFs
  enabled: false             # off by default: when on, image pixels and scanned pages leave your Mac
  max_image_px: 1568         # images are shrunk so the longer side is at most this (256-2576)
  max_pdf_pages: 3           # only the first pages of a PDF with no text layer are sent (1-20)

sensitive:
  detect_secrets: true       # private keys, tokens, credentials found in content
  # Names that say "password", "recovery codes", "seed phrase"... (whole words) keep a
  # file in place too. Patterns here are never sensitive by their name alone (a secret
  # in the content still is); `flib status --sensitive` lists what was left and why.
  allow_names: []            # e.g. ["password reset guide*"]

privacy:
  descriptions: redact       # redact: phone numbers, e-mails, document/card/account numbers in the
                             # AI's descriptions, tags and proposed names become [phone], [email]...
                             # before they are stored. verbatim: store what the AI wrote. The AI is
                             # asked to leave them out either way; names of people rely on that alone.

schedule:
  time: "12:30"              # daily run, 24-hour local time; applied by `flib schedule`
  wait_for_unlock_hours: 8   # 0-23. Files some apps protect while the Mac is locked: after a scheduled
                             # run skipped them, wait up to this long for an unlock and run once
                             # more (0 = don't wait; the next day's run gets them)

summary:                     # RF-40: after a scheduled run, what waits in review or failed (`flib status`)
  notify: true               # one macOS notification, counts only, no file names; false = run log only
  every_days: 7              # at most once every this many days
  min_age_days: 2            # only once a file has waited in review or failed this long

mcp:                         # `flib mcp`: the local MCP server for AI assistants
  read_only: false           # true hides the write tools, recategorize_file and undo

search:
  semantic:                  # RF-15: also find files by meaning ("invoice" finds a "bill")
    enabled: false           # off by default; when on, each run embeds new and changed rows
    default: false           # true: `flib search` (and the MCP tool) search by meaning without --semantic
    base_url: http://localhost:11434/v1  # any OpenAI-compatible /embeddings server; Ollama on this Mac
    model: embeddinggemma    # `ollama pull embeddinggemma`; changing it re-embeds the library
    # api_key_env: MY_EMBEDDINGS_KEY  # unset: FLIB_EMBEDDINGS_API_KEY, then the Keychain
    #                          # (`flib key set --provider embeddings`); never the provider's key
    timeout_seconds: 30
    batch_size: 32           # texts per request (1-256)
    min_similarity: 0.25     # files found only by meaning need this cosine similarity (0-1);
    #                          # word matches always stay. 0 keeps all. Measured for
    #                          # embeddinggemma: another model needs its own value (README)
    # query_prefix: ""         # unset: what the model documents (embeddinggemma has one), else
    # document_prefix: ""      # none; "" turns it off. A new document_prefix re-embeds all
    # Only names, category, tags and description are embedded, never file content or a
    # sensitive file. A remote base_url sends that text, and your queries, off this Mac.
