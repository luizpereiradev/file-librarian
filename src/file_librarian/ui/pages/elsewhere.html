<main class="ended">
  <h1>flib ui is open in another window</h1>
  <p class="lead">The session that <code>flib ui</code> started belongs to the browser or window that opened its link first; this one does not have it.</p>
  <p>Use that window. To move here, choose End session there (or press Ctrl-C where <code>flib ui</code> runs), then run <code>flib ui</code> again.</p>
</main>
