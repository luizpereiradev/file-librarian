[project]
name = "file-librarian"
version = "0.0.1"
description = "Keeps your Downloads folder organized: an AI names, files and describes each new file; deterministic code does the moving."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "file-librarian contributors" }]
keywords = ["macos", "downloads", "organizer", "cli", "llm", "sqlite"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=1",
    "pydantic>=2.7",
    "pypdf>=5",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# `flib mcp`, the MCP server for Claude and other assistants. Optional because
# the SDK brings its HTTP stack along: `./scripts/install.sh --with-mcp`.
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/luizpereiradev/file-librarian"
Source = "https://github.com/luizpereiradev/file-librarian"
Documentation = "https://github.com/luizpereiradev/file-librarian/tree/main/docs"
Issues = "https://github.com/luizpereiradev/file-librarian/issues"
Changelog = "https://github.com/luizpereiradev/file-librarian/blob/main/CHANGELOG.md"

[project.scripts]
flib = "file_librarian.cli:main"

[dependency-groups]
dev = [
    "file-librarian[mcp]",  # tests and mypy cover the MCP server
    "coverage>=7",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_librarian"]

[tool.uv]
# Relative `exclude-newer` durations need a recent uv.
required-version = ">=0.13"
# Supply-chain quarantine: ignore any release uploaded in the last 7 days, so a
# hijacked version is usually caught and yanked before it can reach the lock.
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert by design.
"tests/**" = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["file_librarian"]

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises several pipeline stages together (still offline, still in temp dirs)",
]
