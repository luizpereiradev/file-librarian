name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR pushes are cancelled; every commit on main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, types, tests (Python ${{ matrix.python }})
    # Pinned image: macos-latest jobs were cancelled after waiting 15 minutes
    # for a runner. Dependabot does not bump this; review it with the matrix.
    runs-on: macos-15
    # The suite takes about 7 minutes; the newest Python also runs the disk-image, OCR,
    # notifier, menu bar and browser steps.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the oldest and newest Python (macOS runners are
        # scarce); main gets every supported version.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.15"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # Actions are pinned to full commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests with branch coverage
        run: uv run coverage run -m pytest
      - name: Coverage (fails under 93%)
        run: uv run coverage report
      - name: Cross-volume moves on disk images (APFS, HFS+, exFAT)
        # One version is enough: it exercises the file systems, not Python.
        if: matrix.python == '3.15'
        env:
          FLIB_TEST_VOLUMES: "1"
        run: uv run pytest -m volumes -p no:cacheprovider
      - name: Text recognition with macOS's Vision framework (real OCR)
        if: matrix.python == '3.15'
        env:
          FLIB_TEST_OCR: "1"
        run: uv run pytest -m ocr -p no:cacheprovider
      - name: Notifier app built with the real macOS tools (no notification posted)
        if: matrix.python == '3.15'
        env:
          FLIB_TEST_NOTIFIER: "1"
        run: uv run pytest -m notifier -p no:cacheprovider
      - name: Menu bar applet compiled with the real tools, its parser run by osascript (never shown)
        if: matrix.python == '3.15'
        env:
          FLIB_TEST_MENU: "1"
        run: uv run pytest -m menu -p no:cacheprovider
      - name: flib ui in a real browser (headless Chrome from the runner image)
        if: matrix.python == '3.15'
        env:
          FLIB_TEST_BROWSER: "1"
        run: uv run pytest -m browser -p no:cacheprovider

  # The one required check: it passes only when every matrix entry passed, so
  # the branch rules do not depend on which versions ran.
  passed:
    name: CI passed
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every version passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
