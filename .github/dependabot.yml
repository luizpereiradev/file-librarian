# Dependabot keeps dependencies and pinned actions current.
# A 7-day cooldown matches the `exclude-newer` quarantine in pyproject.toml:
# brand-new releases are where hijacked versions show up first. Security
# updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
