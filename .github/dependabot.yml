# Dependabot keeps dependencies and pinned actions current.
# A 7-day cooldown matches the `exclude-newer` quarantine in pyproject.toml:
# brand-new releases are where hijacked versions show up first.
# Dependabot's security updates skip its cooldown, but they still lock with uv,
# which honors the quarantine: a fix younger than 7 days needs a per-package
# exception in pyproject.toml (see "Urgent security fixes" in SECURITY.md).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
