name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out real file names, paths and contents;
        synthetic examples are enough. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Config: ...
        2. Run `flib simulate`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flib version
      description: Output of `flib --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: data-loss
    attributes:
      label: Was any file lost, overwritten or moved outside the category folders?
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From M3 on, attach the output of `flib doctor` (names and paths redacted).
      render: text
