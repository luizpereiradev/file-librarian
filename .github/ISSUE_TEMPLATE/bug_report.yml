name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out real file names, paths and contents;
        synthetic examples are enough. Security problems go through SECURITY.md, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Config: ...
        2. Run `flib simulate`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: flib version
      description: Output of `flib --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: dropdown
    id: data-loss
    attributes:
      label: Was any file lost, overwritten or moved outside the category folders?
      options: ["No", "Yes"]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics (`flib doctor`)
      description: |
        Run `flib doctor` and attach the file it prints (or paste `flib doctor --stdout --format markdown`).
        It holds the flib, Python and macOS versions, how flib was installed, the configuration,
        where the API key comes from (only the word: environment, keychain, env_file or none; never
        the key), the schedule's state, database counts and the last run logs. File names become
        `<file-N>.ext`, folders `<home>`, `<input-1>`, `<output>`, `<dir-N>`; secrets and e-mail
        addresses are replaced too. Please read it before attaching it.
    validations:
      required: false
